name: Validate Loop Runtime

on:
  pull_request:
    paths:
      - 'tools/**'
      - 'schemas/**'
      - '.github/workflows/validate-loop-runtime.yml'
      - 'README.md'
  push:
    branches:
      - main
    paths:
      - 'tools/**'
      - 'schemas/**'
      - '.github/workflows/validate-loop-runtime.yml'
      - 'README.md'

permissions:
  contents: read

jobs:
  phase-a:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Runtime repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Check Phase A syntax
        shell: bash
        run: |
          node --check tools/loop-engineering/json-schema-lite.mjs
          node --check tools/loop-engineering/dry-run-controller.mjs
          node --check tools/loop-engineering/test-dry-run-controller.mjs

      - name: Test Phase A read-only dry run
        shell: bash
        run: node tools/loop-engineering/test-dry-run-controller.mjs

  phase-b:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Runtime repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Check Phase B syntax
        shell: bash
        run: |
          node --check tools/work-queues/assign-work-queue.mjs
          node --check tools/work-queues/claim-work-queue.mjs
          node --check tools/work-queues/mark-work-queue-ready.mjs
          node --check tools/work-queues/advance-work-queue.mjs
          node --check tools/reliability/single-writer-lock.mjs
          node --check tools/loop-engineering/phase-b-worker-controller.mjs
          node --check tools/loop-engineering/test-phase-b-worker-controller.mjs

      - name: Test Phase B isolated worker loop
        shell: bash
        run: node tools/loop-engineering/test-phase-b-worker-controller.mjs

  phase-c:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Runtime repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Check Phase C syntax
        shell: bash
        run: |
          node --check tools/work-queues/block-work-queue.mjs
          node --check tools/loop-engineering/phase-c-control.mjs
          node --check tools/loop-engineering/phase-c-controller.mjs
          node --check tools/loop-engineering/progress-evidence.mjs
          node --check tools/loop-engineering/local-agent-adapter.mjs
          node --check tools/loop-engineering/test-progress-evidence.mjs
          node --check tools/loop-engineering/test-local-agent-adapter.mjs
          node --check tools/loop-engineering/process-tree-stop.mjs
          node --check tools/loop-engineering/test-process-tree-stop.mjs
          node --check tools/loop-engineering/pilot-verifier.mjs
          node --check tools/loop-engineering/test-pilot-verifier.mjs
          node --check tools/loop-engineering/docker-isolated-agent.mjs
          node --check tools/loop-engineering/test-docker-isolated-agent.mjs
          node --check tools/loop-engineering/test-phase-c-controller.mjs

      - name: Test Phase C progress, local agent bridge and state recovery
        shell: bash
        run: |
          node tools/loop-engineering/test-progress-evidence.mjs
          node tools/loop-engineering/test-local-agent-adapter.mjs
          node tools/loop-engineering/test-process-tree-stop.mjs
          node tools/loop-engineering/test-pilot-verifier.mjs
          node tools/loop-engineering/test-docker-isolated-agent.mjs
          node tools/loop-engineering/test-phase-c-controller.mjs

  phase-d:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Runtime repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Check Phase D syntax
        shell: bash
        run: |
          node --check tools/loop-engineering/phase-d-controller.mjs
          node --check tools/loop-engineering/test-phase-d-controller.mjs

      - name: Test Phase D parallel worker orchestration
        shell: bash
        run: node tools/loop-engineering/test-phase-d-controller.mjs

  phase-e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Runtime repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Checkout current Guide contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: EliteMay/web-project-guide
          path: guide-current

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Check Phase E syntax
        shell: bash
        run: |
          node --check tools/loop-engineering/json-schema-lite.mjs
          node --check tools/reliability/failure-classification.mjs
          node --check tools/reliability/provenance.mjs
          node --check tools/reliability/git-transaction-core.mjs
          node --check tools/loop-engineering/phase-e-controller.mjs
          node --check tools/loop-engineering/test-phase-e-controller.mjs

      - name: Test Phase E remote publication and human review gate
        shell: bash
        env:
          LOOP_GUIDE_ROOT: ${{ github.workspace }}/guide-current
        run: node tools/loop-engineering/test-phase-e-controller.mjs

  isolation-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Runtime repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Prepare offline-pinned Docker test fixture
        shell: bash
        run: |
          set -euo pipefail
          command -v docker
          docker info --format '{{.OSType}}'
          docker pull alpine:3.20
          echo "LOOP_TEST_DOCKER_PATH=$(command -v docker)" >> "$GITHUB_ENV"
          echo "LOOP_TEST_DOCKER_IMAGE_ID=$(docker image inspect --format '{{.Id}}' alpine:3.20)" >> "$GITHUB_ENV"
      - name: Prove base Docker constraints can start with a non-root image worker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/loop-docker-smoke"
          docker --host unix:///var/run/docker.sock run --rm --pull=never \
            --network=none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges=true --pids-limit=32 \
            --memory=256m --memory-swap=256m --cpus=1 \
            --user="$(id -u):$(id -g)" \
            --tmpfs=/tmp:rw,nosuid,nodev,noexec,size=16m \
            --mount="type=bind,src=$RUNNER_TEMP/loop-docker-smoke,dst=/workspace" \
            --workdir=/workspace --env=HOME=/tmp --env=TMPDIR=/tmp \
            --entrypoint /bin/sh "$LOOP_TEST_DOCKER_IMAGE_ID" \
            -c 'echo smoke >/workspace/ok && cat /workspace/ok'
      - name: Fault inject outside-filesystem write, no-network, and worker timeout
        shell: bash
        run: node tools/loop-engineering/test-docker-isolated-agent.mjs
